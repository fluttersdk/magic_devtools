name: Publish to pub.dev

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+*'

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze code
        run: flutter analyze --no-fatal-infos

      - name: Check formatting
        run: dart format --set-exit-if-changed .

      - name: Run tests
        run: flutter test

  # PREREQUISITE, and it is not in this file: pub.dev must have automated publishing
  # turned on for this package (package page -> Admin -> Automated publishing),
  # naming this repository and a matching tag pattern. Without it the workflow gets
  # as far as uploading and pub.dev refuses with "The calling GitHub Action is not
  # allowed to publish, because: publishing from github is not enabled", exit 65.
  # That is what happened to the 0.0.2 tag on 2026-07-29: validate passed, the
  # dry-run reported 0 warnings, and the release still never reached pub.dev, so the
  # version sat unpublished while consumers requiring ^0.0.2 could not resolve at
  # all. 0.0.2 was then published by hand from a maintainer's machine, which does
  # NOT turn the setting on.
  #
  # The setting has since been enabled and the path is verified: re-triggering the
  # workflow on 2026-08-04 got "Version 0.0.2 of package magic_devtools already
  # exists" instead of the permission refusal, which is pub.dev accepting this
  # Action's identity and declining only the duplicate version. So the next release
  # publishes from here. Keep the note anyway: the prerequisite is invisible in this
  # repository, and the failure it causes looks like anything but a missing setting.
  # See https://dart.dev/go/publishing-from-github
  publish:
    needs: validate
    permissions:
      id-token: write # Required for authentication using OIDC
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@v1
