name: Publish to pub.dev

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+*'

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze code
        run: flutter analyze --no-fatal-infos

      - name: Check formatting
        run: dart format --set-exit-if-changed .

      - name: Run tests
        run: flutter test

  # PREREQUISITE, and it is not in this file: pub.dev must have automated publishing
  # turned on for this package (package page -> Admin -> Automated publishing),
  # naming this repository and a matching tag pattern. Without it the workflow gets
  # as far as uploading and pub.dev refuses with "The calling GitHub Action is not
  # allowed to publish, because: publishing from github is not enabled", exit 65.
  # That is what happened to the 0.0.2 tag on 2026-07-29: validate passed, the
  # dry-run reported 0 warnings, and the release still never reached pub.dev, so the
  # version sat unpublished while consumers requiring ^0.0.2 could not resolve at
  # all. 0.0.2 was then published by hand from a maintainer's machine, which does
  # NOT turn the setting on.
  #
  # STILL NOT ENABLED as of 0.0.3, which also had to be published by hand.
  #
  # And do not try to probe it by re-tagging an already-published version: pub.dev
  # checks version-existence BEFORE authorization, so an existing version always
  # answers "Version X of package Y already exists" whether or not publishing from
  # github is enabled. That reply looks like proof the identity was accepted and is
  # not; 0.0.3 was tagged on the strength of that reading and got the permission
  # refusal anyway. The only honest test is a version that does not exist yet.
  # See https://dart.dev/go/publishing-from-github
  publish:
    needs: validate
    permissions:
      id-token: write # Required for authentication using OIDC
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@v1
